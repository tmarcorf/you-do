<div class="card-area">
    @for (toDo of toDos; track $index) {
        <app-card 
            [title]="toDo.title"
            [details]="toDo.details"
            [createdAt]="toDo.createdAt"
            [updatedAt]="toDo.updatedAt"
            [completed]="toDo.completed">
        </app-card>
    }
</div>
